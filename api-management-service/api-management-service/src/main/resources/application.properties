spring.application.name=api-management-service

server.port=8081

info.app.name=Api-Management Gateway Service
info.app.description=Custom API gateway for routing, security, and traffic management

spring.datasource.url=jdbc:mysql://localhost:3306/gatekeeper-management
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration